<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Frog Leaders of Europe</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🐸 Frog Leaders of Europe 🐸</h1>

    <p class="subtitle">
        A birthday adventure across the European Union.
    </p>

    <button id="startButton">
        Start Game
    </button>

    <div id="gameArea" style="display:none;">

        <div id="map"></div>

    </div>

</div>


<!-- POPUP -->

<div id="popup" class="hidden">

    <div id="popupCard">

        <h2 id="countryName"></h2>

        <h3 id="frog"></h3>

        <p id="birthday"></p>

        <p id="trivia"></p>

        <button id="continueButton">
            Continue
        </button>

    </div>

</div>


<script src="countries.js"></script>
<script src="map.js"></script>
<script src="script.js"></script>

</body>

</html>
